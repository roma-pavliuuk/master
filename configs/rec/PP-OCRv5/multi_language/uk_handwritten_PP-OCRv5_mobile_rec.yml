# Ukrainian HANDWRITTEN text recognition: fine-tuning of eslav_PP-OCRv5_mobile_rec
# on real handwritten text lines (e.g. RUKOPYS, see docs/ukrainian_ocr.md).
#
# Differences from uk_PP-OCRv5_mobile_rec.yml (printed):
# * max_text_length 75: in RUKOPYS 63% of handwritten lines are longer than 25
#   characters (median 31, 99th percentile ~70); with 25 they would be silently
#   dropped by MultiLabelEncode.
# * Aspect-ratio aware training (ds_width): each line keeps its own width at
#   height 48 (line aspect ratio median ~12, 90% <= 19 -> ~70-115 CTC steps).
#   Evaluation/inference resize the same way (RecResizeImg eval_mode, base
#   width 160), so lines are not padded to a large fixed width.
# * Mild augmentation (tia_prob 0.2, reverse_prob 0.1), no RecConAug
#   (concatenation of already long lines).
# * Best model is selected by char_acc = 1 - CER instead of line accuracy.
# * Lower learning rate and more epochs: handwriting differs from the printed
#   pretraining domain, all layers are fine-tuned.
#
# A printed-only synthetic dataset is NOT a substitute for real handwriting.
# CPU: add -o Global.use_gpu=False (see docs/ukrainian_ocr.md).
Global:
  model_name: eslav_PP-OCRv5_mobile_rec # registered PaddleX name, do not change
  debug: false
  use_gpu: true
  epoch_num: 60
  log_smooth_window: 20
  print_batch_step: 10
  save_model_dir: ./output/uk_handwritten_rec_ppocrv5
  save_epoch_step: 5
  eval_batch_step: [0, 300]
  cal_metric_during_train: true
  pretrained_model: https://paddle-model-ecology.bj.bcebos.com/paddlex/official_pretrained_model/eslav_PP-OCRv5_mobile_rec_pretrained.pdparams
  # dictionary the pretrained model was trained with (class-wise head transfer)
  pretrained_character_dict_path: ./ppocr/utils/dict/ppocrv5_eslav_dict.txt
  checkpoints:
  save_inference_dir:
  use_visualdl: false
  infer_img: ./train_data/uk_handwritten/images
  character_dict_path: ./ppocr/utils/dict/ppocrv5_uk_dict.txt
  max_text_length: &max_text_length 75
  infer_mode: false
  use_space_char: true
  distributed: true
  save_res_path: ./output/uk_handwritten_rec_ppocrv5/predicts.txt
  d2s_train_image_shape: [3, 48, 960]
  # export inference model to <save_model_dir>/best_accuracy/inference on improvement
  uniform_output_enabled: true


Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.0001
    warmup_epoch: 2
  regularizer:
    name: L2
    factor: 3.0e-05


Architecture:
  model_type: rec
  algorithm: SVTR_LCNet
  Transform:
  Backbone:
    name: PPLCNetV3
    scale: 0.95
  Head:
    name: MultiHead
    head_list:
      - CTCHead:
          Neck:
            name: svtr
            dims: 120
            depth: 2
            hidden_dims: 120
            kernel_size: [1, 3]
            use_guide: True
          Head:
            fc_decay: 0.00001
      - NRTRHead:
          nrtr_dim: 384
          max_text_length: *max_text_length

Loss:
  name: MultiLoss
  loss_config_list:
    - CTCLoss:
    - NRTRLoss:

PostProcess:
  name: CTCLabelDecode

Metric:
  name: RecErrorRateMetric # acc + corpus CER/WER
  # line accuracy stays near 0 for handwriting; select the best model by 1 - CER
  main_indicator: char_acc
  ignore_space: False

Train:
  dataset:
    name: MultiScaleDataSet
    # batches of lines with similar aspect ratio, resized to 48 x (48 * ratio)
    # without padding to a fixed width (~2.3x faster on long lines). Requires
    # "<image>\t<text>\t<w>\t<h>" labels: tools/ukrainian/add_image_sizes.py
    ds_width: true
    data_dir: ./train_data/uk_handwritten/
    label_file_list:
    - ./train_data/uk_handwritten/train_wh.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - RecAug:
        # mild geometry: stronger TIA (0.6) cut parts of handwritten lines and
        # made training samples unreadable; color inversion is rare in practice
        tia_prob: 0.2
        reverse_prob: 0.1
    - MultiLabelEncode:
        gtc_encode: NRTRLabelEncode
    - KeepKeys:
        keep_keys:
        - image
        - label_ctc
        - label_gtc
        - length
        - valid_ratio
  sampler:
    name: MultiScaleSampler
    scales: [[960, 48]] # with ds_width only the height (48) is used
    max_w: 1280 # cap of the batch width; the default 480 would squeeze long lines
    first_bs: &bs 16
    fix_bs: false
    divided_factor: [8, 16] # w, h
    is_training: True
  loader:
    shuffle: true
    batch_size_per_card: *bs
    drop_last: true
    num_workers: 4
Eval:
  dataset:
    name: SimpleDataSet
    data_dir: ./train_data/uk_handwritten/
    label_file_list:
    - ./train_data/uk_handwritten/val.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - MultiLabelEncode:
        gtc_encode: NRTRLabelEncode
    - RecResizeImg:
        # Same resizing as PaddleX inference: height 48, width = 48 * line
        # ratio, padded only up to the base width 160. The model is trained
        # without padding (ds_width), padding lines to 960 at inference breaks it.
        image_shape: [3, 48, 160]
        eval_mode: true
    - KeepKeys:
        keep_keys:
        - image
        - label_ctc
        - label_gtc
        - length
        - valid_ratio
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 1 # variable width per line (eval_mode)
    num_workers: 4
